name: build

# Builds and publishes the image: each arch runner builds and verifies it,
# and hands the result to one publish job that pushes and signs the
# multi-arch manifest. Either both arches publish or neither does.
#
# HOW the image is built and checked lives in the Makefile, which this runs.
# This file only adds what needs GitHub: one runner per arch, moving images
# between runners, the multi-arch manifest, and the signature.
#
# The daily schedule is the whole point of this repo existing: a base image
# nobody rebuilds is worse than no base image at all, because people FROM it
# and ship stale kernels without noticing. If this cron ever stops working,
# that is the bug to fix first.

on:
  schedule:
    - cron: '23 6 * * *'      # 06:23 UTC daily
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '10/**'
      - 'Makefile'
      - 'verify.sh'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - '10/**'
      - 'Makefile'
      - 'verify.sh'
      - '.github/workflows/build.yml'

permissions:
  contents: read
  packages: write
  id-token: write             # keyless cosign signing

env:
  # The Makefile reads these (MAJOR defaults to 10 there).
  IMAGE: ghcr.io/${{ github.repository }}
  TAG: 10-minimal
  PODMAN: sudo podman         # the compose needs mounts rootless podman can't do here
  # Only main publishes. A pull request, or a manual run on any other branch,
  # proves everything builds and stops there. (The publish job's `if:`
  # repeats the expression because job-level conditions can't read env.)
  PUBLISH: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build:
    strategy:
      fail-fast: false        # one arch breaking shouldn't hide the other
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
      # Chunk this build against the one currently published under the same
      # tag, so layers move only when packages do. Best-effort in the Makefile:
      # before the first publish, and in a fork that has never published, this
      # ref does not resolve and the build packs from scratch instead.
      PREVIOUS: docker://ghcr.io/${{ github.repository }}:10-minimal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: make build

      - name: Verify
        run: make verify

      # Nothing is pushed from here. The image leaves this runner as a
      # workflow artifact, and only the publish job -- which runs only if
      # BOTH arches built and verified -- touches the registry.
      - name: Save image for the publish job
        if: env.PUBLISH == 'true'
        run: |
          sudo podman save --format oci-archive -o "$ARCH.oci" "$IMAGE:$TAG"
          sudo chown "$(id -u)" "$ARCH.oci"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.PUBLISH == 'true'
        with:
          name: image-${{ matrix.arch }}
          path: ${{ matrix.arch }}.oci
          retention-days: 1
          if-no-files-found: error

  # The only job that touches the registry, and only after both arches built
  # and verified.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'   # same rule as PUBLISH above
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          merge-multiple: true
          path: images

      - name: Assemble, push, and sign the multi-arch manifest
        run: |
          set -euo pipefail
          # Both log in: podman and cosign keep separate credential stores,
          # and the signature is itself an upload to the registry.
          echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$GITHUB_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

          # `manifest push --all` pushes both arch images by digest plus the
          # list, so the registry never holds a single-arch or unsigned state
          # under any tag.
          list="$IMAGE:$TAG"
          podman manifest create "$list"
          podman manifest add "$list" oci-archive:images/amd64.oci
          podman manifest add "$list" oci-archive:images/arm64.oci

          # :10-minimal floats for people who want current;
          # :10-minimal-YYYYMMDD names the day's build. Same list pushed twice,
          # so both tags share one digest, and that digest is what gets
          # signed: tags move, digests don't.
          #
          # ~400 MB per push to GHCR; a dropped connection mid-blob is the one
          # transient failure this job can hit, and the runner's podman is too
          # old for `push --retry`. A re-push skips blobs the registry already
          # has, so retrying is cheap.
          stamp="$(date -u +%Y%m%d)"
          for tag in "$TAG" "$TAG-$stamp"; do
            for n in 1 2 3 4 5; do
              podman manifest push --all --digestfile "$tag.digest" "$list" "docker://$IMAGE:$tag" && break
              [ "$n" -lt 5 ] || { echo "giving up pushing $IMAGE:$tag" >&2; exit 1; }
              echo "push of $IMAGE:$tag failed (attempt $n of 5); retrying in 20s"; sleep 20
            done
          done
          digest="$(cat "$TAG.digest")"
          test "$digest" = "$(cat "$TAG-$stamp.digest")"

          # Keyless: the signature is bound to this workflow's OIDC identity,
          # so anyone can verify the image came from this repo without
          # trusting a key we have to store and rotate.
          cosign sign --yes "$IMAGE@$digest"
          echo "Published $IMAGE:$TAG and $IMAGE:$TAG-$stamp -> $digest"

          {
            echo "### Published"
            echo
            echo '```sh'
            echo "podman pull $IMAGE:$TAG"
            echo '```'
            echo "Digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
